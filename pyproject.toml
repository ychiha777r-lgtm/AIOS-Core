[project]
name = "aios-core"
version = "0.1.0"
description = "AI Operating System kernel (foundation) — clean architecture & microkernel principles."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name="AIOS Core Maintainers", email="dev@example.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.21",
  "coverage>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
